<!doctype html>
<html lang="he" dir="rtl" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>התחברות · Alpaca</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" integrity="sha384-CfCrinSRH2IR6a4e6fy2q6ioOX7O6Mtm1L9vRvFZ1trBncWmMePhzvafv7oIcWiW" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.bsTheme = 'dark';
  </script>
</head>
<body class="bg-body-tertiary d-flex align-items-center min-vh-100">
<main class="container" style="max-width: 360px">
  <form method="post" action="/login" class="card shadow-sm card-body">
    <h1 class="h5 mb-3">התחברות</h1>
    {{if .failed}}<div class="alert alert-danger py-2">שם משתמש או סיסמה שגויים</div>{{end}}
    <label class="form-label" for="user">שם משתמש</label>
    <input class="form-control mb-3" id="user" name="user" autocomplete="username" required autofocus>
    <label class="form-label" for="password">סיסמה</label>
    <input class="form-control mb-3" id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary w-100">כניסה</button>
  </form>
</main>
</body>
</html>
